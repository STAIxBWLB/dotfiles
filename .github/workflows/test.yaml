name: Test
on:
  push:
    branches: [main]
  # No `paths` filter: the decision job skips the expensive jobs when only
  # non-test files changed, so every commit still gets a Test result that the
  # Release workflow can check. Tags are not tested again; Release checks the
  # tagged commit's main-push run instead.
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per main commit: a newer push would otherwise replace a pending
  # main run, and Release needs every main commit's Test result.
  group: test-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_FILE: test.yaml
          # The former trigger paths filter. docs/releases/ holds release notes only.
          TEST_INPUTS: '^(cmd/|internal/|go\.mod$|go\.sum$|\.testcoverage\.yml$|Makefile$|scripts/|tests/|tools/|docs/|README\.md$|\.github/workflows/|\.goreleaser\.yaml$|\.golangci\.yml$|\.govulncheck-allow\.json$|\.dockerignore$)'
          TEST_IGNORE: '^docs/releases/'
        run: bash scripts/ci-decision.sh

  # Light and always on: release notes are outside the test inputs, so a
  # notes-only PR runs this and nothing heavy (#272).
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Release notes format
        run: |
          bash scripts/check-release-notes.sh --self-test
          bash scripts/check-release-notes.sh

  lint:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
      # Runs here, not in the linux container: this exercises the REPO lint
      # config against fixtures written into the tree, and /tests/scenarios in
      # the image has no repo above it. Placed after the real gate so a bug in
      # the scenario cannot mask a real lint finding.
      - name: CI decision path classification
        run: bash scripts/ci-decision.sh --self-test
      - name: Seam lint rules are not a no-op
        run: bash tests/scenarios/lint-seams-gate.sh
      - name: Dependency vulnerability gate
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          bash scripts/govulncheck-gate.sh
      # Runs here, not in the linux container: this exercises a REPO script and
      # its fixtures, and /tests/scenarios in the image has no repo above it.
      # Placed after the real gate so a bug in the scenario cannot mask a real
      # vulnerability finding.
      - name: Dependency vulnerability gate is not a no-op
        run: bash tests/scenarios/govulncheck-gate.sh
      - name: Coverage floor policy gate is not a no-op
        run: bash tests/scenarios/coverage-policy-gate.sh
      # Runs here, not in the linux container: it copies the harness and
      # assert.sh out of the repo, and /tests/scenarios in the image has no repo
      # above it. ubuntu-latest also gives it the GNU `find -printf` the copied
      # harness needs. Placed after the real gates for the same reason as the
      # two above.
      - name: differential.sh decides all three registry verdict arms correctly
        run: bash tests/scenarios/differential-registry-gate.sh
      - name: cmd/dot must not depend on the man-page toolchain
        run: |
          deps=$(go list -deps ./cmd/dot)
          count=$(printf '%s\n' "$deps" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::go list -deps ./cmd/dot produced no packages, so the import-graph assertion would have been vacuous"
            exit 1
          fi
          echo "import-graph assertion: examined $count packages"
          if printf '%s\n' "$deps" | grep -qE 'go-md2man|blackfriday'; then
            echo "::error::go-md2man or blackfriday reached ./cmd/dot's import graph"
            printf '%s\n' "$deps" | grep -E 'go-md2man|blackfriday'
            exit 1
          fi
      - name: Generate command docs
        id: generate_command_docs
        run: go run ./tools/gendocs docs/commands
      - name: Command docs drift check
        id: check_command_docs
        run: |
          # --porcelain, not `git diff`: git diff reports only tracked paths, so
          # a page for a newly added command that nobody committed passes it
          # green. --porcelain sees untracked, deleted and modified alike.
          if [ -n "$(git status --porcelain docs/commands)" ]; then
            echo "::error::docs/commands is out of date - run 'make docs' and commit the result"
            git status --porcelain docs/commands
            exit 1
          fi
      - name: Upload generated command docs on drift
        if: failure() && steps.generate_command_docs.outcome == 'success' && steps.check_command_docs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: command-docs-${{ github.sha }}
          path: docs/commands/
          if-no-files-found: error
          retention-days: 7
      # Structural guard for the unit job's tool/order/fail-fast contract
      # (BUG-18, BUG-19, G-07-08). Placed after the real lint gates, same rule
      # as the scenario gates above: a bug in this check must not mask a real
      # lint finding.
      - name: Unit CI contract gate
        run: bash scripts/check-unit-ci-contract.sh
      # Phase 09's five vacuity guards (CI-02, CI-03) were each proven once by a
      # local fixture and then never re-run, which is the defect this phase
      # exists to remove, one level up. This gate re-runs their own extracted
      # text against fixtures on every build, with `docker run` stubbed so it
      # needs no image. Placed last, after the real gates, same rule as the
      # scenario gates above: a bug in this check must not mask a real finding.
      - name: Vacuity guards still discriminate
        run: bash scripts/check-vacuity-guards.sh

  unit:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    strategy:
      # One failing leg must not cancel the other platform's BUG-18/BUG-19
      # evidence (G-07-08): run 32977743165's macOS rg failure cancelled the
      # still-running Ubuntu unit before its glyph step under the default.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Require systemd scheduler parser evidence
        if: matrix.os == 'ubuntu-latest'
        run: |
          command -v systemd-analyze
          set -o pipefail
          go test ./internal/syncer -run '^TestSystemdAnalyze_(SpecialHome|ProfiledUnits)$' -count=1 -v 2>&1 | tee systemd-scheduler-parser.log
          if grep -q '^ *--- SKIP: TestSystemdAnalyze_ProfiledUnits' systemd-scheduler-parser.log; then
            echo "::error title=Profiled systemd parser evidence::TestSystemdAnalyze_ProfiledUnits skipped"
            exit 1
          fi
          if ! grep -q '^ *--- PASS: TestSystemdAnalyze_ProfiledUnits' systemd-scheduler-parser.log; then
            echo "::error title=Profiled systemd parser evidence::TestSystemdAnalyze_ProfiledUnits did not pass"
            exit 1
          fi
      # Peer runs refuse openrsync (#175), the only rsync on hosted macOS
      # images, so without Homebrew's 3.x the real-rsync peer tests skip there.
      - name: rsync 3.x for peer tests
        if: matrix.os == 'macos-latest'
        run: brew install rsync
      - name: Peer real-rsync evidence - did it run or skip?
        run: |
          set -o pipefail
          go test ./internal/syncer -run '^TestPeerDiff_NonASCIINameThroughResolvedLocalRsync$' -count=1 -v 2>&1 | tee peer-rsync.log
          if ! grep -q '^--- PASS: TestPeerDiff_NonASCIINameThroughResolvedLocalRsync' peer-rsync.log; then
            echo "::error title=Peer real-rsync evidence::the non-ASCII peer inventory test did not pass (skipped or failed)"
            exit 1
          fi
      - name: Unit tests with coverage
        # Verbose so named Linux scheduler, lock, and service-domain
        # PASS/no-SKIP evidence is auditable (BUG-18); packages, race mode,
        # count, and coverage file are unchanged.
        run: go test ./... -race -count=1 -v -coverprofile=coverage.out
      # `go test ./...` prints `ok` for a package whose test skipped, so a guard
      # that never runs is indistinguishable from one that passed. GUARD-03's Go
      # half skips on any host carrying a Homebrew prefix, which is every hosted
      # macOS runner and possibly every hosted Ubuntu one. Without this step
      # nobody can tell from a CI log whether it contributes coverage at all.
      # Reporting is not enough: the else branch fails rather than letting an
      # unrecognised state pass as good news.
      - name: GUARD-03 Go half - did it run or skip?
        run: |
          go test ./internal/cli -run TestApply_DryRunLeavesEmptyHomeUntouched \
            -count=1 -v 2>&1 | tee guard03.log
          if grep -q '^ *--- SKIP' guard03.log; then
            echo "::notice title=GUARD-03 Go half::SKIPPED on ${{ runner.os }} - a Homebrew prefix defeats the PATH sandbox (BUG-06). GUARD-03 is enforced by the dry-run-empty-home container scenario in the linux job, not here."
          elif grep -q '^ *--- PASS' guard03.log; then
            echo "::notice title=GUARD-03 Go half::RAN and PASSED on ${{ runner.os }} - this runner has no Homebrew prefix."
          else
            echo "::error title=GUARD-03 Go half::neither PASS nor SKIP was observed, so the guard's status is unknown"
            exit 1
          fi
      - name: Build binary
        run: go build -o bin/dot ./cmd/dot/
      - run: ./bin/dot --help
      - run: ./bin/dot version
      - name: Reject init-time terminal queries
        run: bash scripts/check-terminal-query.sh ./bin/dot
      # SPLIT-07's band, enforced rather than measured once at review time: a
      # later command addition that re-inflates a decomposed *_cmd.go fails here.
      - name: Decomposed command files stay in the line band
        run: bash scripts/check-cli-line-band.sh
      # The glyph gate's rg is unstated runner state, not a contract (G-07-08,
      # T-07-54): run 32977743165 failed here on macOS with `rg: command not
      # found`. Provision only when absent, only through the runner-native
      # package manager, and always finish by proving the resolved executable
      # and version so a preinstalled but unusable tool cannot pass by
      # assumption.
      - name: Ensure ripgrep for glyph evidence
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              macOS)
                brew install ripgrep
                ;;
              Linux)
                sudo apt-get update
                sudo apt-get install -y ripgrep
                ;;
              *)
                echo "::error::cannot provision ripgrep: unsupported RUNNER_OS '$RUNNER_OS'"
                exit 1
                ;;
            esac
          fi
          command -v rg
          rg --version
      - name: Shared glyph alphabet has no inline literals
        run: |
          set -o pipefail
          /bin/bash scripts/check-glyph-alphabet.sh 2>&1 | tee glyph-alphabet.log
          if ! grep -Eq 'scanned [1-9][0-9]* Go file\(s\)' glyph-alphabet.log; then
            echo "::error title=Glyph alphabet evidence::no positive Go-file scan count was observed"
            exit 1
          fi
          if ! grep -Eq '[1-9][0-9]* Go file\(s\) measured; no inline glyph literals' glyph-alphabet.log; then
            echo "::error title=Glyph alphabet evidence::no positive Go-file measurement count was observed"
            exit 1
          fi
      - name: Ensure shellcheck (macOS)
        if: runner.os == 'macOS'
        run: command -v shellcheck >/dev/null || brew install shellcheck
      # D-01/D-02: both lint steps take globs, not enumerations, so a script
      # added under scripts/, tests/ or tests/scenarios/ is covered with no edit
      # to this file (CI-03). tests/*.sh is included because run-module.sh,
      # run-profile.sh and assert.sh are the harness every scenario depends on.
      # D-04: bash passes an unmatched glob through as its own literal text, so
      # each expansion is -f tested before it is counted, and a scanned set of
      # size zero fails the step rather than reporting success having measured
      # nothing.
      # This step's `name:` key is an anchor that scripts/check-unit-ci-contract.sh
      # parses: it must survive byte-for-byte, must remain the only occurrence of
      # that string inside the unit job, and the step must stay after the glyph
      # step. The gate counts a `#` comment the same as a YAML key, so its value
      # is deliberately not restated anywhere in this file.
      - name: Shellcheck scripts
        run: |
          set -o pipefail
          files=()
          for f in scripts/*.sh tests/*.sh tests/scenarios/*.sh; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=Shellcheck coverage::the lint globs matched no file, so this step would report success having measured nothing"
            exit 1
          fi
          echo "shellcheck lint coverage: scanned ${#files[@]} shell script(s)"
          # D-03: --severity=warning. The note-level findings below that line are
          # deliberately left uncaught; the largest group is this suite's own
          # `[ test ] && pass || fail` bracket-test-and-or idiom (SC2015), whose
          # rewrite is a separate deferred change. Measured: the 16 files this
          # step used to enumerate report zero findings at default severity
          # today, so the severity line loses nothing currently detectable while
          # bringing 16 more files into scope.
          shellcheck --severity=warning "${files[@]}"
      # D-01/D-02/D-04: same three globs, same -f filter and non-vacuity guard.
      # `bash -n a.sh b.sh` exits 0 with a syntax error in b.sh, because bash
      # treats every argument after the script name as a positional parameter;
      # the single-invocation form this replaces therefore syntax-checked only
      # its first argument. One invocation per file instead. This step carries
      # no `name:` key and is not anchored by scripts/check-unit-ci-contract.sh.
      - run: |
          set -o pipefail
          files=()
          for f in scripts/*.sh tests/*.sh tests/scenarios/*.sh; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=Syntax-check coverage::the syntax-check globs matched no file, so this step would report success having measured nothing"
            exit 1
          fi
          echo "bash -n syntax coverage: checked ${#files[@]} shell script(s)"
          for f in "${files[@]}"; do
            bash -n "$f"
          done
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
      # TEST-01, two Linux-only steps. D-01 makes the linux job authoritative
      # for coverage, the same way it already is for the differential and
      # container scenarios, so both carry the upload step's own
      # `matrix.os == 'ubuntu-latest'` condition. The macOS leg keeps producing
      # its own numbers and is not judged against Linux floors, which would fail
      # it for code that never entered the Linux build.
      #
      # Both sit AFTER the upload rather than before it: a floor failure is
      # exactly when somebody needs coverage.out, and the upload step carries no
      # `if: always()`, so gating ahead of it would withhold the artifact from
      # the only run that needs it.

      # First, so a package with no floor is reported as itself rather than
      # surfacing later as a total that drifted for no visible reason.
      - name: Every package has a coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-coverage-floors.sh
      # `go install` at a pinned version rather than a third-party action,
      # following the govulncheck gate in the lint job: the version is visible
      # here and every other action in this workflow is first-party.
      - name: Coverage floors
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install github.com/vladopajic/go-test-coverage/v2@v2.19.0
          go-test-coverage --config=./.testcoverage.yml

  integration:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [ubuntu-24.04]
        profile: [minimal, full, server]
        include:
          # Minimal/server-stripped base image — only meaningful for server profile.
          - dockerfile: server
            profile: server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: go build -o dot ./cmd/dot/
      - uses: docker/setup-buildx-action@v3
      - name: Build image + run profile
        env:
          TAG: dotfiles-test:${{ matrix.dockerfile }}
          SCOPE: integration-${{ matrix.dockerfile }}
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=$SCOPE" \
            --cache-to "type=gha,mode=max,scope=$SCOPE" \
            -t "$TAG" -f "tests/Dockerfile.${{ matrix.dockerfile }}" .
          docker run --rm "$TAG" /tests/run-profile.sh "${{ matrix.profile }}"

  linux:
    # Combined module + scenario suite: one image build, N fresh-container runs,
    # split into shards so the three slowest cases run side by side.
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [apply, idempotency, rest]
    env:
      TAG: dotfiles-test:linux
      ALL_MODULES: "packages shell node git ssh terminal tmux ai conda"
      ALL_SCENARIOS: "dry-run-all-profiles init-and-apply idempotency server-profile upgrade-check home-override workspace profile-snapshot sync install-script install-security guard dry-run-empty-home differential secrets noindex ssh-loopback"
    steps:
      - uses: actions/checkout@v4
      # Shards are carved out of the full lists, so a module or scenario added
      # to ALL_* lands in `rest` without touching this step.
      - name: Select shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            apply)       picks_s="init-and-apply"; picks_m="" ;;
            idempotency) picks_s="idempotency";    picks_m="packages" ;;
            rest)        picks_s="";               picks_m="" ;;
            *) echo "::error::unknown shard $SHARD"; exit 1 ;;
          esac
          heavy_s="init-and-apply idempotency"; heavy_m="packages"
          for x in $heavy_s; do [[ " $ALL_SCENARIOS " == *" $x "* ]] || { echo "::error::shard scenario $x is not in ALL_SCENARIOS"; exit 1; }; done
          for x in $heavy_m; do [[ " $ALL_MODULES " == *" $x "* ]] || { echo "::error::shard module $x is not in ALL_MODULES"; exit 1; }; done
          if [ "$SHARD" = rest ]; then
            for x in $ALL_SCENARIOS; do [[ " $heavy_s " == *" $x "* ]] || picks_s="$picks_s $x"; done
            for x in $ALL_MODULES; do [[ " $heavy_m " == *" $x "* ]] || picks_m="$picks_m $x"; done
          fi
          echo "SCENARIOS=${picks_s# }" >> "$GITHUB_ENV"
          echo "MODULES=${picks_m# }" >> "$GITHUB_ENV"
          echo "shard $SHARD: modules [${picks_m# }] scenarios [${picks_s# }]"
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      # Both binaries are built through the same Makefile variables with
      # VERSION=diff COMMIT=diff and the same explicit GOTOOLCHAIN, so
      # `dot version` is identical on both and the differential scenario proves
      # that normalization on every run instead of registering it as a diff.
      # BIN is a simple `:=` assignment in the Makefile, so it only takes effect
      # as a command-line variable; it must land at the build-context root
      # because .dockerignore excludes bin/.
      - name: Build current binary
        env:
          GOTOOLCHAIN: go1.26.10
        run: make build BIN=./dot VERSION=diff COMMIT=diff
      # actions/checkout defaults to fetch-depth 1, which does not contain the
      # pinned commit, and the baseline build would fail with a not-a-tree error
      # that reproduces only in CI. Targeted fetch rather than fetch-depth: 0 —
      # cheaper, and it states the pin in the workflow, which is where D-02 says
      # the pin moves by hand.
      - name: Fetch the pinned differential baseline
        run: git fetch --depth=1 origin db057e7ebbd21e0a7256dcd7c1b26ff3870a5478
      # Every component of this key is a constant, so after the first run it is
      # a permanent hit. That is what keeps the scenario's one-minute budget
      # scoped to the comparison rather than to a cold go build.
      - name: Cache the baseline binary
        id: baseline-cache
        uses: actions/cache@v4
        with:
          path: dot-baseline
          key: baseline-${{ runner.os }}-db057e7ebbd21e0a7256dcd7c1b26ff3870a5478-go1.26.10
      - name: Build baseline binary
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        env:
          GOTOOLCHAIN: go1.26.10
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" db057e7ebbd21e0a7256dcd7c1b26ff3870a5478
          make -C "$RUNNER_TEMP/baseline" build BIN="$GITHUB_WORKSPACE/dot-baseline" VERSION=diff COMMIT=diff
          git worktree remove --force "$RUNNER_TEMP/baseline"
      # A cache that restored nothing while the build step was skipped would
      # otherwise surface as an opaque COPY failure inside the image build.
      - name: Both binaries are at the build-context root
        run: ls -l ./dot ./dot-baseline
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        env:
          SCOPE: linux-ubuntu-22.04
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=$SCOPE" \
            --cache-to "type=gha,mode=max,scope=$SCOPE" \
            -t "$TAG" -f tests/Dockerfile.ubuntu-22.04 .
      - name: Modules
        if: env.MODULES != ''
        run: |
          failed=()
          for m in $MODULES; do
            echo "::group::module $m"
            if ! docker run --rm "$TAG" /tests/run-module.sh "$m"; then
              failed+=("$m")
              echo "::error::module $m failed"
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed modules: ${failed[*]}"
            exit 1
          fi
      - name: Scenarios
        if: always()
        run: |
          # Without pipefail the docker run below is piped into tee, and the
          # pipeline would report tee's status instead of the container's.
          set -o pipefail
          # An empty list makes the loop below run zero iterations and exit 0,
          # silently retiring every scenario while the job stays green.
          if [ "$(echo $SCENARIOS | wc -w)" -eq 0 ]; then
            echo "::error::SCENARIOS resolved to zero entries; no scenario would have run"
            exit 1
          fi
          failed=()
          for s in $SCENARIOS; do
            echo "::group::scenario $s"
            log="scenario-$s.log"
            if ! docker run --rm "$TAG" "/tests/scenarios/$s.sh" 2>&1 | tee "$log"; then
              failed+=("$s")
              echo "::error::scenario $s failed"
            fi
            # A scenario that bails whole - `SKIP:` written at column one -
            # runs none of its assertions, and before this guard that read as a
            # pass (D-08). The empty-log arm comes first because a scenario that
            # produced no output at all would otherwise satisfy the skip grep by
            # having nothing to match rather than by having run. The anchor is
            # line-leading on purpose: the indented `~ SKIPPED:` lines that
            # differential.sh, noindex.sh and differential-registry-gate.sh print
            # are deliberate partial skips and stay green.
            if [ ! -s "$log" ]; then
              failed+=("$s")
              echo "::error title=Scenario produced no output::scenario $s wrote nothing, so the skip assertion would have passed by absence of evidence"
            elif grep -q "^SKIP:" "$log"; then
              failed+=("$s")
              echo "::error title=Scenario skipped::scenario $s bailed with a column-one SKIP: line instead of running its assertions"
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed scenarios: ${failed[*]}"
            exit 1
          fi

  apps-install-macos:
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: go build -o bin/dot ./cmd/dot/
      - name: Ensure jq is present
        run: command -v jq >/dev/null || brew install jq
      - name: Install defaults and verify /Applications
        run: bash tests/scenarios/apps-install-macos.sh
      - name: macapps module and command scenario
        run: bash tests/scenarios/macapps.sh
