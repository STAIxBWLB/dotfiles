name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

concurrency:
  # Never cancel a release mid-flight; prevents duplicate goreleaser runs for the same tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag is not vX.Y.Z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_ENV"

      # Test is not re-run for the tag: the tagged commit's main-push Test run
      # (full, or skipped by its decision job because the same tree already
      # passed) is the release gate. Wait for it if it is still running.
      - name: Require a successful Test run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An annotated tag push may carry the tag object, not the commit, in
          # GITHUB_SHA; Test runs are keyed by the commit.
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha) || { echo "::error::cannot resolve $GITHUB_REF_NAME to a commit"; exit 1; }
          deadline=$((SECONDS + 45 * 60)); first_seen=""
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yaml/runs?event=push&head_sha=$commit&per_page=10" \
              --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_started_at) | last // empty | "\(.status) \(.conclusion) \(.html_url)"') || { run=""; api_errors=$((${api_errors:-0} + 1)); echo "::warning::Test run lookup failed (attempt $api_errors)"; }
            if [ -n "$run" ]; then
              read -r status conclusion url <<<"$run"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] && { echo "Test passed for $commit: $url"; break; }
                echo "::error::Test for $commit concluded $conclusion: $url"; exit 1
              fi
              first_seen=${first_seen:-$SECONDS}
            elif [ $SECONDS -gt 600 ] && [ -z "$first_seen" ]; then
              echo "::error::no main-push Test run for $commit (failed lookups: ${api_errors:-0}); tag a commit that is on main"; exit 1
            fi
            [ $SECONDS -lt $deadline ] || { echo "::error::timed out waiting for Test on $commit"; exit 1; }
            sleep 30
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Require release notes
        env:
          NOTES: docs/releases/${{ env.tag }}.md
        run: test -s "$NOTES" || { echo "::error::$NOTES is missing or empty; add it in the release PR (AGENTS.md, Release notes)"; exit 1; }

      - name: Require the tap deploy key
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: test -n "$HOMEBREW_TAP_SSH_KEY" || { echo "::error::secret HOMEBREW_TAP_SSH_KEY is missing; the formula push to STAIxBWLB/homebrew-cask would fail after the release is published"; exit 1; }

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes docs/releases/${{ env.tag }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
