version: 2

builds:
  - main: ./cmd/dot
    binary: dot
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    hooks:
      # A binary dot update could not extract fails the release before
      # anything is published (#231). The test runs on the host, not the target.
      post:
        - cmd: go test ./internal/fileutil -run ^TestReleaseBinaryFitsArchiveLimits$ -count=1
          env:
            - DOT_RELEASE_BINARY={{ .Path }}
            - GOOS=
            - GOARCH=
          output: true

archives:
  - formats:
      - tar.gz
    name_template: "dot_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: STAIxBWLB
    name: dotfiles
  extra_files:
    - glob: scripts/install.sh

# A cask, not a formula: brews is deprecated, and the formula template's
# redundant `version` fails the tap's brew audit (#344). dot update compares
# the rendered cask byte for byte with canonicalGoReleaserCask in
# internal/cli/upgrade_homebrew_prebuilt.go; change both together, and keep
# goreleaser pinned in release.yaml so the template does not drift.
homebrew_casks:
  - name: dotfiles
    repository:
      owner: STAIxBWLB
      name: homebrew-cask
      # The tap audits publish/* and merges it into main itself (#340,
      # STAIxBWLB/homebrew-cask#2); goreleaser creates the branch from main.
      branch: "publish/dotfiles-{{ .Version }}"
      # Write deploy key scoped to the tap repository only.
      git:
        url: "git@github.com:STAIxBWLB/homebrew-cask.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    directory: Casks
    homepage: "https://github.com/STAIxBWLB/dotfiles"
    description: "Declarative dotfiles manager and AI tmux workspace orchestrator"
    # Each entry renders as `binary "<entry>"`; the second keeps the
    # formula's `dotfiles` name as `binary "dot", target: "dotfiles"`.
    binaries:
      - dot
      - 'dot", target: "dotfiles'
    hooks:
      post:
        # The release binary is not notarized; Gatekeeper refuses it while
        # the download's quarantine attribute is set.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/dot"]
          end
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "dotfiles: update to {{ .Tag }}"
