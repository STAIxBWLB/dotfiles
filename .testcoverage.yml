# Per-package coverage floors, enforced in CI by vladopajic/go-test-coverage
# v2.19.0 on the `unit` job's ubuntu-latest leg (TEST-01).
#
# HOW TO READ A FLOOR. The measuring command is CI's own
# `go test ./... -race -count=1 -coverprofile=coverage.out` with NO -coverpkg,
# so each package's denominator is its own statements and its numerator is what
# ITS OWN test binary reached. A floor here therefore asks "does this package
# have tests of its own?", not "does somebody else's test walk through it".
# Adding -coverpkg would change the denominator for every package at once and
# silently shift all 23 numbers below (D-02).
#
# AUTHORITY PLATFORM. Linux, matching the differential and container scenarios
# which already name CI's linux job authoritative (D-01). Two distinct
# mechanisms depress a Linux figure and both are measured, not assumed:
#   - internal/syncer/scheduler_darwin.go carries `//go:build darwin` and leaves
#     the Linux build entirely; its counterpart scheduler_other.go (systemd) is
#     compiled instead, contributing 57 statements of which 0 are hit, because
#     the only scheduler test is scheduler_darwin_test.go and it is darwin-tagged
#     too. That is the whole build-tagged split in this repo.
#   - internal/module/macapps.go carries NO build tag, so it COMPILES on Linux
#     and its 84 statements sit in the denominator with 12 hit. Its darwin
#     behaviour is gated at runtime and its tests skip.
#   Consequence: darwin-only code is not measured by these floors. It is either
#   absent from the build (first case) or present-and-unhit (second case), and
#   only the second case drags a floor down. Raising a floor here can never be
#   achieved by testing darwin-only behaviour; it needs Linux-reachable tests.
#
# HOW FLOORS WERE SEEDED. Each is the measured coverage rounded DOWN to an
# integer, minus one point of slack (D-06). Measured on 2026-08-24 from the
# ubuntu-latest leg of the `unit` job itself (runs 32675151304 and 32675708144),
# confirmed by two runs that agree block for block. Ratcheting is manual: raise
# a number by editing it.
#
# COMPLETENESS. scripts/check-coverage-floors.sh fails the build when a package
# from `go list ./...` appears in neither list, when an entry here names no
# package, when a package appears in both, and when an exclusion carries no
# reason.
#
# ANCHORING, which differs between the two lists and is verified, not assumed:
#   - override.path matches the PACKAGE path with the module prefix stripped
#     (`internal/guard`, not `github.com/STAIxBWLB/dotfiles/internal/guard`
#     — the latter matches nothing). Anchored at BOTH ends: unanchored
#     `^internal/config` also matches `internal/config/catalog`, which is a
#     separate package with a separate floor.
#   - exclude.paths matches FILE paths, also module-prefix-stripped. NO trailing
#     anchor: `^cmd/dot$` matches nothing because the profile records
#     `cmd/dot/main.go`, so the exclusion would be decorative while looking
#     deliberate.

profile: coverage.out

threshold:
  # File-level floors are noise on a repo this size; per-package floors below
  # are the enforcement. Package-level default is 1, so a missing override
  # fails closed even before the completeness guard reports it.
  file: 0
  package: 1
  # Repo total measured 50.2542% (9588/19079).
  total: 49

override:
  - path: ^internal/admission$ # measured 73.0% on darwin at introduction; the two live-probe shell-out bodies (snapshotDarwin/snapshotLinux) stay fixture-bypassed and unhit by design
    threshold: 70
  # Initial constrained Darwin fixture run for #153 measured 78.0% and 80.4%.
  # Linux CI remains authoritative; existing floors are unchanged.
  - path: ^internal/aipolicy$
    threshold: 77
  - path: ^internal/aisession$
    threshold: 79
  - path: ^internal/aisettings$ # measured 71.6% on darwin after claude-mem sync and bridge were replaced by amem (dotfiles#255); the floor is unchanged
    threshold: 62
  # New package floors: authoritative Ubuntu unit run 36305525701,
  # job 108581294497, coverage artifact 10927082672, head 7227f170.
  # Profile SHA-256: 4b395167dacd918a389b4c91fee3161fa1cf2242fc7cdf2a2f1b89e789deaa85
  # Each follows floor(measured percentage) - 1; existing floors are unchanged.
  - path: ^internal/aihandoff$ # measured 73.737374% (219/297) on Linux
    threshold: 72
  - path: ^internal/aischedule$ # measured 77.631579% (177/228) on Linux
    threshold: 76
  - path: ^internal/aitooling$ # measured 43.145442% (620/1437) on Linux
    threshold: 42
  - path: ^internal/resourceguard$ # measured 47.201493% (253/536) on Linux
    threshold: 46
  - path: ^internal/appsettings$ # measured 54.1133% (296/547)
    threshold: 53
  - path: ^internal/claudecfg$ # measured 83.6735% (41/49)
    threshold: 82
  - path: ^internal/clean$ # measured 76.6667% (69/90)
    threshold: 75
  - path: ^internal/cli$ # measured 48.0195% (4837/10073) on darwin
    threshold: 40
  - path: ^internal/config$ # measured 70.7516% (433/612)
    threshold: 69
  - path: ^internal/config/catalog$ # measured 91.4894% (43/47)
    threshold: 90
  - path: ^internal/container$ # measured 91.2442% (198/217) on darwin
    threshold: 89
  - path: ^internal/exec$ # measured 46.5318% (161/346)
    threshold: 45
  - path: ^internal/fileutil$ # measured 55.1867% (133/241)
    threshold: 54
  - path: ^internal/ghauth$ # measured 100.0000% (6/6)
    threshold: 99
  - path: ^internal/guard$ # measured 92.3077% (168/182)
    threshold: 91
  - path: ^internal/module$ # measured 21.9512% (207/943)
    threshold: 20
  - path: ^internal/noindex$ # measured 91.2281% (52/57)
    threshold: 90
  - path: ^internal/profilesnap$ # measured 74.5455% (164/220)
    threshold: 73
  - path: ^internal/secrets$ # measured 44.9339% (102/227)
    threshold: 43
  - path: ^internal/sliceutil$ # measured 100.0000% (24/24)
    threshold: 99
  - path: ^internal/snapstore$ # measured 48.4211% (46/95)
    threshold: 47
  - path: ^internal/syncer$ # measured 60.0000% (2442/4070)
    threshold: 59
  - path: ^internal/template$ # measured 80.0000% (16/20)
    threshold: 65
  - path: ^internal/tunnel$ # measured 31.6964% (142/448)
    threshold: 30
  - path: ^internal/ui$ # measured 19.9442% (143/717)
    threshold: 18
  - path: ^internal/watchdog$ # measured 75.3% on darwin after P2 review fixes; warp daemon install/launchctl branches are present-and-unhit on Linux
    threshold: 74
  - path: ^internal/workspace$ # measured 60.8434% (101/166)
    threshold: 59
  - path: ^internal/ws$ # measured 60.6897% (176/290)
    threshold: 59

exclude:
  paths:
    # cmd/dot is main() with every decision delegated to internal/cli, which
    # carries its own floor above. What covers it instead: the container
    # scenarios under tests/scenarios/ execute the BUILT BINARY end to end, so
    # a broken main() fails them rather than passing a unit floor.
    - ^cmd/dot/
    # tools/gendocs is a build-time generator with no runtime callers. What
    # covers it instead: GUARD-06, the `make docs` plus `git status --porcelain
    # docs/commands` check in the lint job, which fails the build when its
    # output drifts from the committed pages.
    - ^tools/gendocs/
